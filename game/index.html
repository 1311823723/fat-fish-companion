<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4efe4" />
    <title>大肥鱼的小屋</title>
  </head>
  <body>
    <main id="app">
      <header>
        <div>
          <h1>大肥鱼的小屋</h1>
        </div>
        <button id="settings" aria-label="小屋设置">设置</button>
      </header>
      <form id="quickChatForm" class="quick-chat" aria-label="快捷聊天">
        <input id="quickChatInput" maxlength="500" placeholder="和肥鱼说句话…" aria-label="快捷聊天内容" />
        <button id="quickChatSend">发送</button>
      </form>
      <label id="notifyChoice" class="notify-choice" hidden><input type="checkbox" id="notifyMe" /> 回复后通过 QQ 提醒我（需在私聊白名单）</label>
      <section id="game" aria-label="互动小屋">
        <p class="loading">打开小屋…</p>
        <div class="room-status" aria-label="小屋时间、天气与大肥鱼状态">
          <time id="clock" class="room-status-clock"></time>
          <span id="weather" class="room-status-weather">天气同步中</span>
          <span id="place" class="room-status-place">位置同步中</span>
          <span id="roomActivity" class="room-status-activity">状态同步中</span>
        </div>
        <details class="life-card"><summary aria-label="展开生活状态"><span id="hungerHint">饱食同步中</span><span id="energyHint">精力同步中</span><span id="moodHint">心情同步中</span></summary>      <section class="needs" aria-label="生活状态">
        <label
          >饱食 <meter id="hunger" max="100"></meter
          ><span id="hungerValue"></span></label
        ><label
          >精力 <meter id="energy" max="100"></meter
          ><span id="energyValue"></span></label
        ><label
          >心情 <meter id="mood" max="100"></meter><span id="moodValue"></span
        ></label>
      </section></details>
        <button id="publicBoardButton" class="board-room-entry" aria-label="打开公共留言板"><span aria-hidden="true">✉</span> 留言板</button>
        <div id="roomReply" class="room-reply" role="status" aria-live="polite" hidden></div>
        <button id="memoryCorner" class="memory-corner" aria-label="看看旅行纪念" hidden><img id="memoryCornerPhoto" alt="" hidden /><span id="memoryCornerLabel">旅行纪念</span></button>
      </section>
      <div class="room-info">
        <span id="connection" role="status">连接中</span>
      </div>
      <nav class="primary-actions" aria-label="小屋常用入口">
        <button id="feed">放食物</button><button id="playShortcut">陪她玩</button><button id="albumShortcut">旅行相册</button><button id="moreActions" aria-haspopup="dialog">更多</button>
      </nav>
      <div class="legacy-controls" hidden><button data-activity="walk">走一走</button><button data-activity="sleep">睡觉</button><button data-activity="wake">叫醒</button><button id="tea">喝点东西</button></div>

      <nav class="tools legacy-controls" hidden>
        <button id="curtain">窗帘</button><button id="light">灯光</button
        ><button id="fridge">冰箱</button><button id="diary">日记</button
        ><button id="album">相册</button><button id="backpack">背包</button
        ><button id="souvenirs">收藏</button>
        <button id="television">游戏机</button>
        <button data-activity="read">翻翻书</button>
        <button data-activity="sing">哼首歌</button>
        <button data-activity="eat">吃点饭</button>
      </nav>
      <p id="notice" role="status"></p>
      <section class="chat">
        <div class="chat-heading">
          <h2>和她说说话</h2>
          <div><button id="messageBoard">我的留言</button> <button id="identity">做客</button></div>
        </div>
        <div id="chatLog" aria-live="polite"></div>
        <form id="chatForm">
          <input
            id="chatInput"
            maxlength="500"
            placeholder="回来啦？"
            aria-label="聊天内容"
          /><button id="chatSend">发送</button>
        </form>
      </section>
      <footer>
        <a href="/assets/CREDITS.txt" target="_blank" rel="noopener"
          >素材署名</a
        >
      </footer>
    </main>
    <dialog id="panel">
      <header>
        <h2 id="panelTitle"></h2>
        <button id="closePanel" aria-label="关闭">关闭</button>
      </header>
      <div id="panelBody"></div>
    </dialog>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
