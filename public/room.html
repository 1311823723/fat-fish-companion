</div><div class="room-toolbar"><div><strong>把日子过得软一点</strong><small>厚厚的被子 · 软乎乎的枕头 · 一冰箱奶茶</small></div><button class="secondary" id="fridgeToggle" aria-expanded="false" aria-controls="scene">打开奶茶冰箱</button></div><div class="items" id="items"></div><p class="muted" style="font-size:12px">这是你们共同想象的房间，物品和布置会留在这里。</p></div><div class="card reflection"><h2>那些慢慢留下的印象</h2><p id="relationship" class="muted">还没有写下关系印象，慢慢相处就好。</p><div id="feelings"></div><small>主观感受会淡去，不代表对方的真实动机。</small></div><div class="card reflection"><h2>最近写下的日记</h2><div id="diaries"></div><p id="diaryBody"></p><small>这里只先露出一点线索。展开不会自动延长留存。</small></div></section><aside><div class="card"><div class="section-head"><h2>窗台上的便签</h2><small>最近 5 条 · 可钉住 2 条</small></div><div id="notes"></div><form id="noteForm"><label for="note" class="muted">给她留句话</label><textarea id="note" maxlength="240" required placeholder="比如：我把雨伞放在门边了，晚上再过来坐坐。"></textarea><button style="margin-top:10px">留在窗台</button></form><small style="display:block;margin-top:12px">留言后，她会在服务在线、可唤醒时看到；打开或关闭网页不会被当成冷落。</small></div></aside></div><footer>共同布置，慢慢相处。小屋只在本机开放。</footer></main><script>
const fridgeButton=document.getElementById('fridgeToggle');fridgeButton.onclick=()=>{const open=$('scene').classList.toggle('fridge-open');fridgeButton.setAttribute('aria-expanded',String(open));fridgeButton.textContent=open?'关上冰箱，留住凉意':'打开奶茶冰箱';};
let token=localStorage.getItem('consoleToken')||'';const $=id=>document.getElementById(id);let loading=false;
async function api(action,extra={}){const r=await fetch('/api/companion-room',{method:'POST',headers:{'content-type':'application/json','x-console-token':token},body:JSON.stringify({action,...extra})});const v=await r.json();if(!r.ok||v.ok===false)throw Error(v.error||'暂时无法连接');return v;}
function el(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
async function load(){if(loading)return;loading=true;try{const v=await api('status');render(v);$('auth').hidden=true;$('message').textContent='';}catch(e){$('message').textContent=e.message;$('auth').hidden=false;}finally{loading=false;}}
function render(v){const r=v.room,h=v.heart;$('subtitle').textContent='搬进来第 '+r.daysTogether+' 天 · '+(r.phase==='day'?'日光正好':'灯还为你留着');$('scene').classList.toggle('night',r.phase==='night');$('phase').textContent=r.phase==='day'?'白天 · 北京时间':'夜晚 · 北京时间';$('items').replaceChildren(...r.items.map(x=>el('span',x.place+' · '+x.name+'：'+x.description,'item')));$('notes').replaceChildren(...r.notes.slice().reverse().map(n=>{const box=el('div','','note'),pin=el('button',n.pinned?'取消钉住':'钉住');pin.onclick=async()=>{try{await api('room_pin',{id:n.id});await load();}catch(e){$('message').textContent=e.message;}};box.append(pin,el('small',(n.actor==='owner'?'你':'大肥鱼')+' · '+new Date(n.at).toLocaleString('zh-CN')),el('div',n.text));return box;}));$('relationship').textContent=h.relationship?.text||'还没有写下关系印象，慢慢相处就好。';$('feelings').replaceChildren(...h.feelings.map(x=>el('p',(x.tag?x.tag+' · ':'')+x.text)));$('diaries').replaceChildren(...v.diaryHints.map(x=>{const box=el('div','','diary-hint');box.append(el('div',x.date+' · '+(x.mood||'一点旧印象')+(x.hint?' · '+x.hint:'')));const b=el('button','展开这一页','secondary');b.onclick=async()=>{try{const data=await api('diary_open',{id:x.id});$('diaryBody').textContent=data.entry['内容'];}catch(e){$('message').textContent=e.message;}};box.append(b);return box;}));}
$('auth').onsubmit=async e=>{e.preventDefault();token=$('access').value.trim();try{await api('status');localStorage.setItem('consoleToken',token);$('access').value='';await load();}catch(e){$('message').textContent=e.message;}};$('refresh').onclick=load;$('noteForm').onsubmit=async e=>{e.preventDefault();try{await api('room_note',{text:$('note').value});$('note').value='';await load();}catch(e){$('message').textContent=e.message;}};if(token)load();setInterval(()=>{if(token&&!document.hidden)load();},60000);
</script></body></html>
